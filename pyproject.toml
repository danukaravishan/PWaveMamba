[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pwavemamba"
version = "1.1.0"
description = "Multi-task selective state-space model for single-station earthquake early warning"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["torch>=2.0", "numpy", "scipy", "h5py"]

[project.optional-dependencies]
gpu = ["mamba-ssm==1.2.0.post1"]
data = ["pandas", "obspy", "matplotlib"]

[tool.setuptools]
packages = ["pwavemamba"]
